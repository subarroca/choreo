    <text x="70" y="395" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Alto</text>
  </g>
  
  <g id="card4">
    <rect x="20" y="435" width="1240" height="80" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="45" cy="475" r="15" fill="#9ca3af"/>
    <text x="70" y="470" font-family="Arial, sans-serif" font-size="16" fill="#374151">Pere Sánchez</text>
    <text x="70" y="490" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Baix</text>
