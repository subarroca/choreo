<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Fons -->
  <rect width="1280" height="720" fill="#ffffff"/>
  
  <!-- Header -->
  <rect width="1280" height="80" fill="#1f2937"/>
  <text x="640" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Choir Positions</text>
  
  <!-- Títol -->
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">Membres del Cor</text>
  
  <!-- Cards -->
  <g id="card1">
    <rect x="20" y="150" width="1240" height="80" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="45" cy="190" r="15" fill="#9ca3af"/>
    <text x="70" y="185" font-family="Arial, sans-serif" font-size="16" fill="#374151">Maria García</text>
    <text x="70" y="205" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Soprano</text>
  </g>
  
  <g id="card2">
    <rect x="20" y="245" width="1240" height="80" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="45" cy="285" r="15" fill="#9ca3af"/>
    <text x="70" y="280" font-family="Arial, sans-serif" font-size="16" fill="#374151">Joan Martí</text>
    <text x="70" y="300" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Tenor</text>
  </g>
  
  <g id="card3">
